<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ account }} · 持仓明细</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">← 账户权益总览</a>
    <span class="title" id="account">{{ account }}</span>
    <div class="meta" id="meta">加载中…</div>
  </header>

  <main>
    <div class="card">
      <table class="grid">
        <thead>
          <tr>
            <th>合约ID</th>
            <th>买卖</th>
            <th class="num">逐日浮盈</th>
            <th class="num">逐笔浮盈</th>
            <th class="num">今仓</th>
            <th class="num">持仓量</th>
            <th class="num">逐笔开仓均价</th>
            <th class="num">占用保证金</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="8" class="empty">正在加载…</td></tr>
        </tbody>
        <tfoot id="foot"></tfoot>
      </table>
    </div>
  </main>

  <script>window.POSITION_ACCOUNT = {{ account | tojson }};</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script>PF.loadPositions(window.POSITION_ACCOUNT);</script>
</body>
</html>
