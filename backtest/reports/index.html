<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回测报告 - 图片浏览</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }
        .filters {
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        .filters input {
            padding: 8px 15px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #333;
            color: #fff;
            width: 300px;
        }
        .filters button {
            padding: 8px 20px;
            margin-left: 10px;
            background: #007acc;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .filters button:hover { background: #005fa3; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
        .card {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .card-title {
            padding: 10px 15px;
            font-size: 14px;
            background: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stats {
            text-align: center;
            margin-top: 20px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>📊 回测报告图片浏览</h1>

    <div class="filters">
        <input type="text" id="search" placeholder="搜索图片名称..." />
        <button onclick="filterImages()">搜索</button>
    </div>

    <div class="grid" id="grid"></div>

    <div class="stats" id="stats"></div>

    <script src="images.js"></script>
    <script>
        // 读取 charts 目录下的所有图片
        const imageFiles = IMAGES_PLACEHOLDER;

        const grid = document.getElementById('grid');
        const stats = document.getElementById('stats');

        function renderImages(files) {
            grid.innerHTML = '';
            files.forEach(file => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="charts/${file}" alt="${file}" loading="lazy" />
                    <div class="card-title">${file}</div>
                `;
                grid.appendChild(card);
            });
            stats.textContent = `共 ${files.length} 张图片`;
        }

        function filterImages() {
            const keyword = document.getElementById('search').value.toLowerCase();
            const filtered = imageFiles.filter(f => f.toLowerCase().includes(keyword));
            renderImages(filtered);
        }

        document.getElementById('search').addEventListener('keyup', filterImages);

        // 初始渲染
        renderImages(imageFiles);
    </script>
</body>
</html>
